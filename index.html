<head>

<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#141414;--mut:#707070;--line:#e7e5df;--soft:#f1efea;--chg:#ff7a00;--ok:#1f8a4c;--err:#c0392b;--own:#eef4ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;width:360px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.brand{font-weight:700;letter-spacing:.2em;font-size:18px}
.brand small{display:block;letter-spacing:.08em;font-weight:500;color:var(--mut);font-size:11px;margin-top:4px}
.field{margin-top:16px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--ink)}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#bbb}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.err{color:var(--err);font-size:12px;margin-top:10px;min-height:16px}
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px}
.top .brand{font-size:14px}
.ctabs{display:flex;gap:4px;overflow-x:auto;flex:1}
.ctab{background:transparent;border:0;color:#bdbdbd;padding:8px 16px;border-radius:999px;font-weight:500;white-space:nowrap}
.ctab:hover{color:#fff}
.ctab.on{background:#fff;color:var(--ink)}
.uchip{display:flex;align-items:center;gap:8px}
.uchip .nm{font-weight:600}
.role{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:#333;color:#ddd}
.top .btn{background:transparent;color:#fff;border-color:#3a3a3a}
.top .btn:hover{border-color:#888}
.stabs{display:flex;gap:2px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:56px;z-index:25}
.stab{border:0;background:transparent;padding:13px 14px;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.stab.on{color:var(--ink);border-bottom-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:101px;z-index:20}
.search{position:relative;flex:0 1 340px}
.search input{padding-left:34px;border-radius:999px;background:var(--soft);border-color:transparent}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}
.qf{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip b{font-weight:600}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spacer{flex:1}
.stats{display:flex;gap:22px;padding:16px 20px 6px;color:var(--mut);font-size:12px;align-items:baseline;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:20px;font-weight:700;margin-right:4px}
.wrap{padding:8px 20px 40px}
.secttl{grid-column:1/-1;font-weight:700;font-size:14px;margin:18px 0 2px;display:flex;align-items:center;gap:10px}
.secttl:after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .15s, box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.08)}
.fbs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}.fb{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f1efea;color:#333;white-space:nowrap}
.fb.cx{background:#d92d20;color:#fff}.fb.pd{background:#f79009;color:#fff}.fb.lt{background:#fdecec;color:#b42318}.fb.ok{background:#e9f7ef;color:#1f6b3f}
.card.fcx{border:2px solid #d92d20}.card.fcx .ph img{opacity:.45;filter:grayscale(1)}.card.fpd{border:2px solid #f79009}.card.flt{border:2px solid #f4a39b}
.ph{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,#efede7,#e4e1d9);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
img.px:not(.ok){opacity:0}
img.px.ok{opacity:1;transition:opacity .25s}
.hero .none,.ph .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a9a59b;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.hero{position:relative}
.ph .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a9a59b;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.ph .bl{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.ph .br{position:absolute;right:10px;top:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:17px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px)}
.pill.dark{background:rgba(20,20,20,.85);color:#fff}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cn{font-weight:600;font-size:14px;line-height:1.3}
.cc{font-size:11px;color:var(--mut);letter-spacing:.03em}
.ctags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;line-height:18px}
.cf{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--soft);font-size:12px;color:var(--mut)}
.cf b{color:var(--ink)}
.chgdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--chg);margin-right:5px}
.gridwrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 240px)}
table.g{border-collapse:separate;border-spacing:0;min-width:100%}
.g th,.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top;background:#fff}
.g thead th{position:sticky;top:0;z-index:5;background:#fafaf8;text-align:left}
.g th .h{padding:8px 10px;min-width:110px;max-width:240px}
.g th .hn{font-weight:600;font-size:12px}
.g th .ho{display:inline-block;margin-top:4px;font-size:10px;padding:2px 7px;border-radius:999px;background:var(--soft);color:#555}
.g td .v{padding:7px 10px;max-width:240px;max-height:90px;overflow:hidden;white-space:pre-wrap;word-break:break-word;position:relative}
.g td.ed .v{cursor:pointer}
.g td.ed:hover .v{background:#fafaf3;box-shadow:inset 0 0 0 1px #d9d9cf}
.g td.chg .v:after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--chg)}
.g tr.sec td{background:#f3f1ec;font-weight:600;padding:8px 12px}
.g .thumb{width:54px;height:70px;object-fit:cover;border-radius:6px;display:block;margin:6px}
.g .rn{padding:8px;font-size:11px;color:#999}
.pop{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);width:330px;max-width:calc(100vw - 20px)}
.pop .hd{padding:12px 14px;border-bottom:1px solid var(--line)}
.pop .hd .t{font-weight:600}
.pop .hd .s{font-size:11px;color:var(--mut);margin-top:3px}
.pop .warn{font-size:11px;background:#fff7e0;color:#7a5600;padding:6px 8px;border-radius:8px;margin-top:8px}
.pop .pb{padding:12px 14px;max-height:340px;overflow:auto}
.pop .pf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.opts{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.opt{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:8px}
.opt:hover,.opt.sel{background:var(--soft)}
.opt.sel{font-weight:600}
.opt .cnt{color:#aaa;font-size:11px}
.optnew{color:#1d3f8f}
.chk{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px}
.chk:hover{background:var(--soft)}
.muted{font-size:11px;color:#9a978f}
.ov{position:fixed;inset:0;background:rgba(10,10,10,.4);z-index:50}
.page{position:fixed;top:0;right:0;bottom:0;width:min(1180px,100vw);background:var(--bg);z-index:55;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.phd{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px}
.phd .t{font-size:18px;font-weight:700;flex:1;min-width:0}
.phd .t small{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-top:2px}
.pgrid{display:grid;grid-template-columns:400px 1fr;gap:22px;padding:22px}
@media(max-width:900px){.pgrid{grid-template-columns:1fr}}
.gal{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:14px}
.hero{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.hero img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:84px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--ink)}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:16px}
.box h3{margin:0;padding:13px 16px;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.box h3 .av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.box h3 .sub{color:var(--mut);font-weight:500;font-size:12px}
.box h3 .sp{flex:1}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kv .f{padding:10px 16px;border-bottom:1px solid var(--soft);position:relative}
.kv .f.ed{cursor:pointer}
.kv .f.ed:hover{background:#fbfaf6}
.kv .f.ed:hover .k:after{content:"  ✎";color:#999}
.kv .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.kv .vv{margin-top:4px;white-space:pre-wrap;word-break:break-word;min-height:18px}
.kv .vv.empty{color:#c4c0b6}
.kv .f.chg:after{content:"";position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--chg)}
.kv .f.ro .k:before{content:"ƒx ";color:#bbb}
.tp{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tpfile{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.tpfile .ic{width:36px;height:44px;border-radius:6px;background:#fdecec;color:#b42318;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px}
.tpfile .nm{font-weight:600;font-size:12.5px;word-break:break-all}
.drop{border:1.5px dashed #cfcbc1;border-radius:12px;padding:16px;text-align:center;color:var(--mut);cursor:pointer}
.drop:hover,.drop.hov{border-color:var(--ink);color:var(--ink);background:#fbfaf6}
.modal{position:fixed;z-index:60;top:5vh;left:50%;transform:translateX(-50%);width:min(1100px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mh{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2}
.mh .t{font-size:16px;font-weight:700;flex:1}
.mb{padding:16px 20px}
table.lt{border-collapse:collapse;width:100%;font-size:12px}
.lt th{text-align:left;background:#fafaf8;font-weight:600}
.lt th,.lt td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.lt .old{color:#a33;text-decoration:line-through;opacity:.8}
.lt .new{color:var(--ok);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .field{margin-top:0}
.mtabs{display:flex;gap:4px;margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw}
.toast.e{background:var(--err)}
.loading{padding:70px;text-align:center;color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:98;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.zoom img{max-width:94vw;max-height:94vh;border-radius:8px}
.pdfv{position:fixed;inset:3vh 3vw;z-index:97;background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.pdfv iframe{flex:1;border:0;width:100%}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pinpad button{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;font-weight:600}
.pinpad button:hover{background:var(--soft)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.dots span{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink)}
.dots span.f{background:var(--ink)}
.flash{animation:fl 1.4s ease}
@keyframes fl{0%{background:#d6f5df}100%{background:transparent}}

html,body{overflow-x:hidden;max-width:100%}
.top{min-width:0}
.ctabs{min-width:0;scrollbar-width:none}.ctabs::-webkit-scrollbar{display:none}
.bell{position:relative;background:transparent;border:1px solid #3a3a3a;color:#fff;border-radius:9px;padding:5px 9px}
.bell b{position:absolute;top:-6px;right:-6px;background:#ff4d4f;color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;min-width:16px}
.menuBtn{display:none;background:transparent;border:1px solid #3a3a3a;color:#fff;border-radius:9px;padding:5px 10px}
.qf{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}.qf::-webkit-scrollbar{display:none}
.chip{white-space:nowrap}
.stageBar{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 0;scrollbar-width:none}.stageBar::-webkit-scrollbar{display:none}
.sc{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font-size:11px;white-space:nowrap;cursor:pointer;color:var(--mut)}
.sc b{display:block;font-size:15px;color:var(--ink)}
.sc.on{background:var(--ink);color:#fff;border-color:var(--ink)}.sc.on b{color:#fff}
.prog{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:2px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#22c55e)}
.stg{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:6px}.stg b{color:var(--ink);font-weight:600}
.steps{display:flex;gap:0;overflow-x:auto;padding:16px 10px 8px}
.step{flex:1 0 92px;text-align:center;position:relative;cursor:default}
.step:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:first-child:before{display:none}
.step .dot{width:28px;height:28px;border-radius:50%;margin:0 auto;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;position:relative;z-index:1;color:var(--mut)}
.step.done .dot{background:#16a34a;border-color:#16a34a;color:#fff}.step.done:before{background:#16a34a}
.step.cur .dot{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 0 0 4px rgba(20,20,20,.12)}.step.cur:before{background:#16a34a}
.step .nm{font-size:11px;margin-top:6px;font-weight:600;line-height:1.25}
.step .dp{font-size:10px;color:var(--mut)}
.step.ed{cursor:pointer}.step.ed:hover .dot{border-color:var(--ink)}
.rq{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.rq .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px}
.st.pending{background:#fff4e0;color:#8a5a00}.st.approved{background:#e9f7ef;color:#1f6b3f}.st.rejected{background:#fdecec;color:#9b2c2c}
.pv{font-size:12px;color:var(--mut);margin-top:6px;white-space:pre-wrap}
@media(max-width:820px){
 .top{height:auto;flex-wrap:wrap;gap:8px;padding:10px 12px}
 .top .brand{order:1}
 .menuBtn{display:inline-block;order:3}
 .bell{order:2;margin-left:auto}
 .ctabs{order:4;flex:1 1 100%}
 .uchip{display:none;order:5;flex:1 1 100%;flex-wrap:wrap}
 .top.open .uchip{display:flex}
 .stabs{position:static;padding:0 8px}
 .bar{position:static;padding:10px 12px}
 .search{flex:1 1 100%}
 .stats{padding:12px 12px 4px;gap:14px}.stats b{font-size:16px}
 .wrap{padding:8px 12px 30px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .cb{padding:10px}.cn{font-size:13px}
 .page{width:100vw}
 .phd{padding:10px 12px;flex-wrap:wrap}
 .pgrid{grid-template-columns:1fr;padding:12px;gap:12px}
 .gal{position:static}
 .hero{aspect-ratio:4/5;max-height:70vh}
 .kv{grid-template-columns:1fr 1fr}
 .modal{top:0;width:100vw!important;max-height:100vh;height:100vh;border-radius:0}
 .pop{left:8px!important;right:8px;width:auto}
 .stageBar{padding:4px 12px 0}
}
@media(min-width:821px) and (max-width:1280px){.cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.pgrid{grid-template-columns:340px 1fr}}

/* v8: fit text inside pills/tags, clamp long text, full-page table */
.pill,.tag{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.ph .bl{right:10px}.ph .bl .pill{max-width:calc(100% - 4px)}
.pill.sm,.tag.sm{font-size:10px;padding-left:7px;padding-right:7px}
.pill.xs,.tag.xs{font-size:9px;padding-left:6px;padding-right:6px;letter-spacing:-.01em}
.ctags .tag{max-width:calc(50% - 3px)}
.kv .vv .tag{white-space:normal;text-overflow:clip;line-height:16px;padding-top:3px;padding-bottom:3px;border-radius:12px}
.kv .vv.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kv .more{border:0;background:none;padding:2px 0 0;font-size:11px;font-weight:600;color:var(--ink);text-decoration:underline;cursor:pointer}
.step .nm{font-size:10.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;padding:0 2px}
.step .dp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.stg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

<body>
<div id="app"><div class="loading"><span class="spin"></span></div></div>
<script>
const S={token:null,user:null,collections:[],cid:null,tabsMeta:null,tab:null,data:null,f:{q:'',cols:{},mine:false},view:'cards',editing:false,cur:null,tc:{},opts:{}};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function call(action,payload){if(window.CC_API){return fetch(window.CC_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.token,action,payload:payload||null})}).then(r=>{if(!r.ok)throw new Error('Server error '+r.status);return r.json()}).then(r=>{if(r.ok)return r.data;if(r.code==='AUTH'&&action!=='login')signOutLocal();throw new Error(r.error)})}
  return new Promise((res,rej)=>{google.script.run.withSuccessHandler(s=>{const r=JSON.parse(s);if(r.ok)res(r.data);else{if(r.code==='AUTH'&&action!=='login')signOutLocal();rej(new Error(r.error))}}).withFailureHandler(e=>rej(e)).api(S.token,action,payload?JSON.stringify(payload):'')})}
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),e?5000:2600)}
function fmtT(iso){if(!iso)return'';const d=new Date(iso);if(isNaN(d))return iso;return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
const ROLE={viewer:'Read only',full:'Full access',admin:'Admin'};
const isFull=()=>S.user&&S.user.role!=='viewer';
const isAdmin=()=>S.user&&S.user.role==='admin';
function myTags(){return norm(S.user.owners||S.user.name).split(/[,\/&+]| and /).map(x=>x.trim()).filter(Boolean)}
function ownerMine(o){if(!o||!S.user)return false;const T=myTags();return norm(o).split(/[\/,&+]| and /).map(x=>x.trim()).some(x=>x&&T.some(n=>x===n||n.indexOf(x)===0||x.indexOf(n)===0))}
function ownerList(){const o={};(S.data?S.data.columns:[]).forEach(c=>String(c.owner||'').split(/[\/,&+]| and /).map(x=>x.trim()).filter(Boolean).forEach(x=>o[x.toUpperCase()]=1));return Object.keys(o).sort()}
function canCol(c){return S.user&&(S.user.role==='admin'||(S.user.role==='full'&&(!c.owner||ownerMine(c.owner))))}
const PAL=['#eef4ff:#1d3f8f','#e9f7ef:#1f6b3f','#fff4e0:#8a5a00','#fdecec:#9b2c2c','#f2ecff:#5b3a9b','#e8f7f7:#17676b','#f1efea:#444','#fff0f6:#9b2c64'];
function tagStyle(v){let h=0;for(const ch of String(v))h=(h*31+ch.charCodeAt(0))>>>0;const[b,c]=PAL[h%PAL.length].split(':');return `background:${b};color:${c}`}
function hiRes(u,sz){if(!u||u==='sheet')return u;sz=sz||1600;let x=String(u);
  if(/googleusercontent\.com/.test(x)){ if(/=[swh]\d+[^\/]*$/.test(x)) x=x.replace(/=[swh]\d+[^\/]*$/,'=s'+sz); else if(!/=/.test(x.split('/').pop())) x+='=s'+sz; }
  const m=x.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/); if(m) x='https:\/\/drive.google.com/thumbnail?id='+m[1]+'&sz=w'+sz;
  return x}
function imgErr(i){if(i.dataset.o&&i.src!==i.dataset.o){i.src=i.dataset.o;i.dataset.o=''}else i.remove()}
function zoomSrc(s){const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${s}">`;z.onclick=()=>z.remove();document.body.appendChild(z)}
const PX={c:{},q:[],busy:0,io:null,size:(window.innerWidth<820?420:560)};
const IDB={db:null,p:null,open(){if(this.p)return this.p;this.p=new Promise(res=>{try{const r=indexedDB.open('cc_px',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)}catch(e){res(null)}});return this.p},
  async getMany(keys){const db=await this.open();if(!db)return {};return new Promise(res=>{const out={};try{const st=db.transaction('i').objectStore('i');let n=keys.length;if(!n)return res(out);keys.forEach(k=>{const q=st.get(k);q.onsuccess=()=>{if(q.result)out[k]=q.result;if(!--n)res(out)};q.onerror=()=>{if(!--n)res(out)}})}catch(e){res(out)}})},
  async put(k,v){const db=await this.open();if(!db||!v)return;try{db.transaction('i','readwrite').objectStore('i').put(v,k)}catch(e){}}};
function pxApply(el){const u=el.dataset.px,d=PX.c[u];if(d===undefined)return false;if(d){el.src=d;el.classList.add('ok')}else if(/^https?:/.test(u)&&!el.dataset.tried){el.dataset.tried=1;el.onerror=()=>el.replaceWith(Object.assign(document.createElement('div'),{className:'none',textContent:'No photo'}));el.src=u;el.classList.add('ok')}else{el.replaceWith(Object.assign(document.createElement('div'),{className:'none',textContent:'No photo'}))}return true}
function pxScan(){if(!PX.io)PX.io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;PX.io.unobserve(e.target);if(!pxApply(e.target)){PX.q.push(e.target);pxRun()}})},{rootMargin:'600px'});
  document.querySelectorAll('img.px:not(.ok)').forEach(el=>{if(!pxApply(el))PX.io.observe(el)})}
function pxRun(){while(PX.busy<4&&PX.q.length){PX.busy++;pxWork().finally(()=>{PX.busy--;if(PX.q.length)pxRun()})}}
async function pxWork(){while(PX.q.length){const els=PX.q.splice(0,6).filter(e=>document.body.contains(e));let urls=[...new Set(els.map(e=>e.dataset.px).filter(u=>PX.c[u]===undefined))];
  if(urls.length){const sz=PX.size;const got=await IDB.getMany(urls.map(u=>sz+'|'+u));urls.forEach(u=>{const v=got[sz+'|'+u];if(v)PX.c[u]=v});urls=urls.filter(u=>PX.c[u]===undefined)}
  if(urls.length){try{const r=await call('imgs',{urls,size:PX.size});urls.forEach(u=>{PX.c[u]=r[u]||'';if(r[u])IDB.put(PX.size+'|'+u,r[u])})}catch(e){urls.forEach(u=>PX.c[u]='')}}
  els.forEach(pxApply);document.querySelectorAll('img.px:not(.ok)').forEach(el=>{if(PX.c[el.dataset.px]!==undefined)pxApply(el)})}}
function zoom(u){if(PX.c[u])return zoomSrc(PX.c[u]);const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${esc(hiRes(u))}">`;z.onclick=()=>z.remove();document.body.appendChild(z)}

async function boot(){S.token=LS.get('cc_token');S.view=LS.get('cc_view')||'cards';
  if(S.token){try{const me=await call('me');S.user=me.user;S.collections=me.collections;S.ai=!!me.ai;S.stages=me.stages||[];return startApp()}catch(e){S.token=null;LS.del('cc_token')}}
  showLogin()}
async function showLogin(){const app=$('#app');app.innerHTML='<div class="loading"><span class="spin"></span></div>';
  let st;try{st=await call('status')}catch(e){app.innerHTML='<div class="loading">'+esc(e.message)+'</div>';return}
  if(st.needsSetup){app.innerHTML=`<div class="login"><div class="lcard"><div class="brand">CLOUD<small>COLLECTIONS · FIRST-TIME SETUP</small></div>
    <div class="field"><label>Admin name</label><input class="inp" id="sn" value="Amr"></div>
    <div class="field"><label>Admin PIN (4–8 digits)</label><input class="inp" id="sp" type="password" inputmode="numeric" maxlength="8"></div>
    <div class="field"><button class="btn pri" style="width:100%" id="sb">Create admin & sign in</button></div><div class="err" id="se"></div></div></div>`;
    $('#sb').onclick=async()=>{try{afterLogin(await call('setupAdmin',{name:$('#sn').value,pin:$('#sp').value}))}catch(e){$('#se').textContent=e.message}};return}
  let pin='';
  app.innerHTML=`<div class="login"><div class="lcard"><div class="brand">CLOUD<small>COLLECTIONS · PLANNING × FASHION × PRODUCTION</small></div>
    <div class="field"><label>Who are you?</label><select class="inp" id="lu">${st.users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</select></div>
    <div class="field"><label>PIN</label><div class="dots" id="ld"></div><div class="pinpad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'→'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div>
    <div class="err" id="le"></div></div></div>`;
  const last=LS.get('cc_last');if(last&&st.users.some(u=>u.id===last))$('#lu').value=last;
  const dots=()=>{$('#ld').innerHTML=Array.from({length:Math.max(4,pin.length)},(_,i)=>`<span class="${i<pin.length?'f':''}"></span>`).join('')};
  const go=async()=>{if(pin.length<4)return;$('#le').innerHTML='<span class="spin"></span>';try{const r=await call('login',{id:$('#lu').value,pin});LS.set('cc_last',$('#lu').value);afterLogin(r)}catch(e){pin='';dots();$('#le').textContent=e.message}};
  const key=k=>{if(k==='⌫')pin=pin.slice(0,-1);else if(k==='→')return go();else if(pin.length<8)pin+=k;dots()};
  app.querySelectorAll('.pinpad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  document.onkeydown=e=>{if(!$('.pinpad'))return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')go()};dots()}
async function afterLogin(r){document.onkeydown=null;S.token=r.token;LS.set('cc_token',r.token);S.user=r.user;const me=await call('me');S.user=me.user||r.user;S.collections=me.collections;S.ai=!!me.ai;S.stages=me.stages||[];startApp()}
function signOutLocal(){S.token=null;S.user=null;S.chat=[];LS.del('cc_token');closeAll();document.querySelectorAll('.aifab,.aip').forEach(x=>x.remove());showLogin()}

function startApp(){S.f.mine=S.user.role==='full';ensureFab();
  $('#app').innerHTML=`<div class="top" id="topbar"><div class="brand">CLOUD</div><button class="bell" id="bell" title="Notifications">🔔<b id="bellN" style="display:none"></b></button><button class="menuBtn" id="menuBtn">☰</button><div class="ctabs" id="ctabs"></div><div class="uchip">${isFull()?'<button class="btn sm" id="bReq">+ Request</button>':''}
    ${isFull()?'<button class="btn sm" id="bHist">History</button>':''}${isAdmin()?'<button class="btn sm" id="bAdm">Admin</button>':''}
    <span class="nm">${esc(S.user.name)}</span><span class="role">${ROLE[S.user.role]}</span>
    <button class="btn sm" id="bMe">PIN</button><button class="btn sm" id="bOut">Sign out</button></div></div>
    <div class="stabs" id="stabs"></div><div id="main"></div>`;
  $('#bOut').onclick=async()=>{try{await call('logout')}catch(e){}signOutLocal()};
  $('#bMe').onclick=changePin;$('#menuBtn').onclick=()=>$('#topbar').classList.toggle('open');$('#bell').onclick=openNotifs;if($('#bReq'))$('#bReq').onclick=()=>openRequest();pollNotifs();if($('#bHist'))$('#bHist').onclick=openHistory;if($('#bAdm'))$('#bAdm').onclick=openAdmin;
  renderCtabs();const c=S.collections.find(x=>x.id===LS.get('cc_cid'))||S.collections[0];
  if(c)selectCollection(c.id);else $('#main').innerHTML='<div class="loading">No collections yet.</div>'}
function renderCtabs(){$('#ctabs').innerHTML=S.collections.map(c=>`<button class="ctab ${c.id===S.cid?'on':''}" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join('');
  $('#ctabs').querySelectorAll('.ctab').forEach(b=>b.onclick=()=>selectCollection(b.dataset.id))}
async function selectCollection(cid){S.cid=cid;LS.set('cc_cid',cid);renderCtabs();$('#stabs').innerHTML='';$('#main').innerHTML='<div class="loading"><span class="spin"></span> Loading collection…</div>';
  try{S.tabsMeta=await call('tabs',{cid})}catch(e){$('#main').innerHTML='<div class="loading">'+esc(e.message)+'</div>';return}
  const t=S.tabsMeta.tabs.find(x=>x.name===LS.get('cc_tab_'+cid))||S.tabsMeta.tabs[0];renderStabs();
  if(t){loadOpts(cid);selectTab(t.name).then(()=>prefetch(cid))}else $('#main').innerHTML='<div class="loading">No tabs available for your access.</div>'}
function renderStabs(){const m=S.tabsMeta;
  $('#stabs').innerHTML=m.tabs.map(t=>`<button class="stab ${t.name===S.tab?'on':''}" data-n="${esc(t.name)}">${esc(t.name)}</button>`).join('')+'<span class="spacer"></span>'+(m.url?`<a class="stab" href="${esc(m.url)}" target="_blank">Open sheet ↗</a>`:'');
  $('#stabs').querySelectorAll('.stab[data-n]').forEach(b=>b.onclick=()=>selectTab(b.dataset.n))}
async function selectTab(name,silent,force){const ck=S.cid+'|'+name;
  if(!silent){S.tab=name;LS.set('cc_tab_'+S.cid,name);S.f={q:S.f.q,cols:{},mine:S.f.mine,stage:null,dept:null};renderStabs();
    if(S.tc[ck]){S.data=S.tc[ck];renderMain();silent=true}else $('#main').innerHTML='<div class="loading"><span class="spin"></span> Loading '+esc(name)+'…</div>'}
  try{const d=await call('tab',{cid:S.cid,tab:name,force:!!force});prep(d);S.tc[ck]=d;if(S.tab!==name)return;S.data=d;
    if(silent&&$('#body')){renderBody();renderStats()}else renderMain(silent);if(S.cur&&document.querySelector('.page'))renderPage()}
  catch(e){if(!silent)$('#main').innerHTML='<div class="loading">'+esc(e.message)+'</div>'}}
async function prefetch(cid){if(!S.tabsMeta)return;for(const t of S.tabsMeta.tabs){const ck=cid+'|'+t.name;if(S.tc[ck])continue;if(S.cid!==cid)return;
  try{const d=await call('tab',{cid,tab:t.name});prep(d);S.tc[ck]=d}catch(e){}}}
function loadOpts(cid){if(!isFull()||S.opts[cid])return;S.opts[cid]={};call('opts',{cid}).then(o=>{S.opts[cid]=o||{}}).catch(()=>{delete S.opts[cid]})}

function findCol(d,rx,type){return d.columns.findIndex(c=>rx.test(c.name)&&(!type||c.type===type))}
function prep(d){
  d.K={img:d.columns.findIndex(c=>c.type==='image'),code:d.keyCode,name:d.keyName,

function readB64(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(f)})}
async function uploadTP(r,files){files=Array.from(files||[]);if(!files.length)return;const d=S.data;

  try{const payload={cid:S.cid,tab:S.tab,row:r.r,key:rowKey(d,r),label:($('#tpl')||{}).value||'',files:[]};

function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc='https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}res(window.pdfjsLib)};sc.onerror=()=>rej(new Error('PDF viewer could not load'));document.head.appendChild(sc)})}

function shrink(f,max){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res({mime:'image/jpeg',data:cv.toDataURL('image/jpeg',0.85).split(',')[1]})};im.onerror=()=>res(null);im.src=fr.result};fr.readAsDataURL(f)})}

function actHtml(a,mi,ai){const ch=a.changes||[];const lines=ch.slice(0,10).map(x=>`<div>${esc(x.field)}${x.owner?` <span class="muted">(${esc(x.owner)})</span>`:''}: ${a.type==='update'&&x.from?`<span class="old">${esc(x.from)}</span> → `:''}<b>${esc(x.to)}</b></div>`).join('')+(ch.length>10?`<div class="muted">+${ch.length-10} more fields</div>`:'');

  if(a.type==='stage')return `<label class="acard"><input type="checkbox" data-a="${mi}:${ai}" checked><div style="flex:1;min-width:0"><div>➜ <b>${esc(a.target)}</b> → stage <b>${esc(a.stage)}</b> <span class="muted">(${esc(a.dept||'')})</span></div>${a.label?`<div class="muted">${esc(a.label)}</div>`:''}</div></label>`;
  const head=(a.type==='create'?`➕ New product${a.copyFrom?` — copy of <b>${esc(a.copyLabel)}</b>`:''}${a.photo!=null||a.photoUrl?' + photo':''}`:`✎ Update <b>${esc(a.target)}</b>`)+(a.photoUrl?`<img class="aph" src="${esc(a.photoUrl)}" referrerpolicy="no-referrer" onerror="this.remove()">`:'');
  return `<label class="acard"><input type="checkbox" data-a="${mi}:${ai}" ${a.blocked&&a.blocked.length&&!ch.length?'':'checked'}><div style="flex:1;min-width:0"><div>${head}</div>${a.label?`<div class="muted">${esc(a.label)}</div>`:''}<div class="ach">${lines||'<span class="muted">No field changes</span>'}</div>
   ${a.blocked&&a.blocked.length?`<div class="warn" style="margin-top:4px">Not your fields (skipped): ${esc(a.blocked.join(', '))}</div>`:''}${a.asRequest?'<div class="muted" style="margin-top:4px">→ goes to the admin as a request for approval</div>':''}</div></label>`}
function drawChat(){const box=$('#aimsgs');if(!box)return;
  if(!S.chat.length){box.innerHTML=`<div class="am a">Hi ${esc(S.user.name)} 👋<br>What should I do? Type or tap 🎤.</div>`;return}
  box.innerHTML=S.chat.map((m,mi)=>{if(m.role==='user')return `<div class="am u" dir="auto">${esc(m.text)}${(m.thumbs||[]).map(u=>`<img src="${u}">`).join('')}</div>`;
    if(m.role==='wait')return '<div class="am a"><span class="spin"></span> Thinking…</div>';
    let h=`<div class="am a"><div dir="auto" style="white-space:pre-wrap">${esc(m.text||'')}</div>`;
    if(m.pics&&m.pics.length)h+=`<div class="apics">${m.pics.map(u=>`<img src="${esc(u)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()" onclick="zoomSrc(this.src)">`).join('')}</div>`;
    if(m.sources&&m.sources.length)h+=`<div class="asrc">${m.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`).join('')}</div>`;
    if(m.actions&&m.actions.length){h+=m.actions.map((a,ai)=>actHtml(a,mi,ai)).join('');
      h+=m.applied?`<div class="aires">${m.applied}</div>`:`<div class="row" style="margin-top:8px"><button class="btn pri sm" data-apply="${mi}">Apply</button><button class="btn sm" data-cancel="${mi}">Cancel</button></div>`}
    return h+'</div>'}).join('');
  box.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>aiApplyMsg(Number(b.dataset.apply),b));
  box.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{const m=S.chat[Number(b.dataset.cancel)];m.applied='<span class="muted">Cancelled — nothing changed.</span>';drawChat()});
  box.scrollTop=box.scrollHeight}
async function aiSend(audio){const p=$('.aip');const tx=$('#aitx',p);const text=tx.value.trim();if(!text&&!p.files.length&&!audio)return;if(!S.data)return toast('Open a tab first',true);
  const files=p.files.slice();p.files=[];drawThumbs();tx.value='';
  const images=await shrinkAll(files);const thumbs=images.map(x=>'data:'+x.mime+';base64,'+x.data);
  const history=S.chat.filter(m=>m.role==='user'||m.role==='ai').slice(-8).map(m=>({role:m.role,text:m.text}));
  const um={role:'user',text:audio?(text?text+' ':'')+'🎤 Voice message…':text,thumbs};S.chat.push(um);S.chat.push({role:'wait'});drawChat();$('#aisend',p).disabled=true;
  try{const r=await call('aiAgent',{cid:S.cid,tab:S.tab,text,images,audio:audio||null,focusRow:S.cur||null,history});S.chat.pop();
    if(audio)um.text=(text?text+' ':'')+'🎤 '+(r.heard||'(voice)');
    S.chat.push({role:'ai',text:r.reply||(r.actions.length||(r.pics||[]).length?'':'—'),actions:r.actions,images,tab:S.tab,cid:S.cid,pics:r.pics||[],sources:r.sources||[]});if(r.quota){const q=$('#aiq2');if(q)q.textContent=`AI budget: $${r.quota.spent.toFixed(2)} of $${r.quota.allow.toFixed(2)} used this month`}}
  catch(e){S.chat.pop();S.chat.push({role:'ai',text:'✕ '+e.message})}
  $('#aisend',p).disabled=false;drawChat()}
async function aiApplyMsg(mi,btn){const m=S.chat[mi];const sel=[...document.querySelectorAll(`[data-a^="${mi}:"]`)].filter(x=>x.checked).map(x=>m.actions[Number(x.dataset.a.split(':')[1])]);
  if(!sel.length)return toast('Nothing selected',true);btn.disabled=true;btn.innerHTML='<span class="spin"></span> Applying…';
  try{const r=await call('aiApply',{cid:m.cid,tab:m.tab,images:m.images,actions:sel.map(a=>({type:a.type,row:a.row,rows:a.rows,items:a.items,stage:a.stage,dept:a.dept,key:a.key,copyFrom:a.copyFrom,values:a.values,photo:a.photo,label:a.label}))});
    const ok=r.done.filter(x=>x.ok),bad=r.done.filter(x=>x.error);
    m.applied=`<b style="color:var(--ok)">✓ Done</b> — ${ok.map(x=>x.request?`request sent for approval (${esc(x.label||'')})`:x.deleted!=null?`${x.deleted} row(s) deleted${x.skipped&&x.skipped.length?' · skipped '+esc(x.skipped.join(', '))+' (sheet changed — ask again)':''}`:x.stage?`stage set to ${esc(x.stage)}`:x.row?`new product added at row ${x.row}`:`${esc(x.label||'updated')}: ${x.changed} field(s)${x.skipped&&x.skipped.length?' · skipped '+esc(x.skipped.join(', ')):''}`).join(' · ')}${bad.length?`<div class="warn">${bad.map(x=>esc((x.label||'')+': '+x.error)).join('<br>')}</div>`:''}`;
    S.tc={};if(S.tab===m.tab&&S.cid===m.cid)selectTab(S.tab,true,true).catch(()=>{});pollNotifs()}
  catch(e){m.applied=`<span class="warn">✕ ${esc(e.message)}</span>`}drawChat()}
function micInline(){return window.top===window&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)}
function b64OfBytes(u8){let s='';const n=0x8000;for(let i=0;i<u8.length;i+=n)s+=String.fromCharCode.apply(null,u8.subarray(i,i+n));return btoa(s)}
function wavB64(chunks,sr){let len=0;chunks.forEach(c=>len+=c.length);const all=new Float32Array(len);let o=0;chunks.forEach(c=>{all.set(c,o);o+=c.length});
  const tr=16000,ratio=sr/tr,n=Math.floor(all.length/ratio),pcm=new Int16Array(n);for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,all[Math.floor(i*ratio)]));pcm[i]=v<0?v*0x8000:v*0x7fff}
  const buf=new ArrayBuffer(44+pcm.length*2),dv=new DataView(buf);const ws=(off,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(off+i,str.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+pcm.length*2,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,tr,true);dv.setUint32(28,tr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);return {mime:'audio/wav',data:b64OfBytes(new Uint8Array(buf)),secs:n/tr}}
let REC=null;
async function recStart(btn){const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();try{await ac.resume()}catch(e){}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}})}catch(e){try{ac.close()}catch(x){}throw new Error(e&&e.name==='NotAllowedError'?'Allow the microphone for this page (browser settings), then try again':'Microphone not available: '+(e.message||e.name))}
  const src=ac.createMediaStreamSource(st),pr=ac.createScriptProcessor(4096,1,1),chunks=[];pr.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));src.connect(pr);pr.connect(ac.destination);
  const r={btn,ta:null,chunks,t0:Date.now(),stop:async()=>{try{pr.disconnect();src.disconnect()}catch(e){}st.getTracks().forEach(t=>t.stop());const sr=ac.sampleRate;try{await ac.close()}catch(e){}return wavB64(chunks,sr)}};
  r.timer=setInterval(()=>{const s=Math.round((Date.now()-r.t0)/1000);btn.dataset.t=s+'s';if(s>=90)btn.click()},500);return r}
async function aiVoice(ta,btn){
  if(!micInline())return openVoice(ta);
  if(REC){const r=REC;REC=null;clearInterval(r.timer);btn.classList.remove('rec');btn.disabled=true;
    try{const live=await liveStop(r);const a=await r.stop();if(a.secs<0.6&&!live){toast('Too short — hold on and speak, then tap again',true);return}
      if(live){ta.value=(r.base?r.base+' ':'')+live;if(ta.id==='aitx'){ta.placeholder=ta.dataset.ph||ta.placeholder;await aiSend()}else{ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus()}return}
      if(ta.id==='aitx'){ta.placeholder=ta.dataset.ph||ta.placeholder;ta.value=r.base||'';await aiSend(a)}
      else{btn.textContent='…';const t=await call('aiTranscribe',{audio:a});if(t.text){const cur=ta.value;ta.value=cur+(cur&&!/\s$/.test(cur)?' ':'')+t.text.trim();ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus()}else toast('Could not hear anything — try again',true)}}
    catch(e){toast(e.message,true)}finally{btn.disabled=false;btn.textContent='🎤'}return}
  try{REC=await recStart(btn);REC.ta=ta;btn.classList.add('rec');btn.textContent='■';if(ta.id==='aitx'){ta.dataset.ph=ta.placeholder;ta.placeholder='Listening… speak, then tap ■ to send'}liveStart(REC,ta)}
  catch(e){REC=null;toast(e.message,true)}}
function liveStart(r,ta){const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C)return;let sr;try{sr=new C()}catch(e){return}
  const base=ta.value.trim();r.base=base;r.live='';r.fin='';sr.lang=LS.get('cc_vlang')||'ar-EG';sr.interimResults=true;sr.continuous=true;
  sr.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)r.fin+=x[0].transcript.trim()+' ';else it+=x[0].transcript}r.live=(r.fin+it).trim();ta.value=(base?base+' ':'')+r.live;ta.scrollTop=ta.scrollHeight;ta.dispatchEvent(new Event('input',{bubbles:true}))};
  r.srDone=new Promise(res=>{sr.onend=res;sr.onerror=()=>res()});
  sr.onend=null;sr.addEventListener('end',()=>{if(REC===r){try{sr.start()}catch(e){}}});
  try{sr.start();r.sr=sr}catch(e){}}
async function liveStop(r){if(!r.sr)return '';const done=new Promise(res=>{r.sr.addEventListener('end',res);setTimeout(res,1500)});try{r.sr.stop()}catch(e){}await done;return (r.live||'').trim()}
boot();
